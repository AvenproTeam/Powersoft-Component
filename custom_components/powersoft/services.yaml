load_snapshot:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: powersoft
    snapshot:
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: box

set_matrix_gain:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: powersoft
    input:
      required: true
      selector:
        number:
          min: 1
          max: 16
          mode: box
    output:
      required: true
      selector:
        number:
          min: 1
          max: 16
          mode: box
    gain:
      required: true
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider
