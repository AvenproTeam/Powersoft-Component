set_gain:
  name: Set Gain
  description: Set the gain level for a specific channel
  fields:
    entity_id:
      name: Entity
      description: The media player entity to control
      required: true
      selector:
        entity:
          domain: media_player
          integration: powersoft
    channel:
      name: Channel
      description: Channel number
      required: true
      selector:
        number:
          min: 1
          max: 16
          mode: box
    gain:
      name: Gain
      description: Gain level in dB
      required: true
      selector:
        number:
          min: -80
          max: 0
          step: 0.5
          unit_of_measurement: "dB"
          mode: slider

set_mute:
  name: Set Mute
  description: Mute or unmute a specific channel
  fields:
    entity_id:
      name: Entity
      description: The media player entity to control
      required: true
      selector:
        entity:
          domain: media_player
          integration: powersoft
    channel:
      name: Channel
      description: Channel number
      required: true
      selector:
        number:
          min: 1
          max: 16
          mode: box
    mute:
      name: Mute
      description: Mute state
      required: true
